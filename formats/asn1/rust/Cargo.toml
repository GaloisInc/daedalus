[package]
name = "asn1-tests"
version = "0.1.0"
edition = "2024"

[dependencies]
# The parser generated by `daedalus compile-rust` (see ../Makefile).
asn1 = { path = "../gen" }
# Must resolve to the same directory as the `daedalus-rts-rust` dependency
# in ../gen/Cargo.toml, so that both crates share one RTS instance.
daedalus-rts-rust = { path = "../../../rts-rust" }
serde_json = "1.0"
